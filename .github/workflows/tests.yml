name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pester Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [Version]'5.0.0' }
          if (-not $pester) {
              Install-Module -Name Pester -MinimumVersion 5.3.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Execute Pester Tests
        shell: pwsh
        run: |
          $configuration = [PesterConfiguration]@{
              Run = @{
                  Path = "tests"
              }
              Output = @{
                  Verbosity = 'Detailed'
              }
          }
          Invoke-Pester -Configuration $configuration
